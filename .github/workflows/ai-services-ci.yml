name: Fluently AI services CI

on:
  push:
    paths:
      - 'backend/ai-services/**'
      - 'backend/docker-compose.yml'
      - '.github/workflows/ai-services-ci.yml'
  pull_request:
    paths:
      - 'backend/ai-services/**'
      - 'backend/docker-compose.yml'
      - '.github/workflows/ai-services-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke-test:
    name: Docker / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - conversation
          - recommendation
          - matchmaking
          - event-generator
          - feedback-analysis
    env:
      COMPOSE_FILE: backend/docker-compose.yml
      COMPOSE_PROJECT_NAME: fluently-ai-ci
      SERVICE: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker compose build "${SERVICE}-service"

      - name: Start service and wait for healthcheck
        run: docker compose up --detach --no-deps --wait --wait-timeout 120 "${SERVICE}-service"

      - name: Verify HTTP endpoints inside the container
        run: |
          docker compose exec -T "${SERVICE}-service" python - "$SERVICE" <<'PY'
          import json
          import sys
          import urllib.request

          service = sys.argv[1]
          for path, status in (("/", "running"), ("/health", "ok")):
              with urllib.request.urlopen(
                  f"http://127.0.0.1:8000{path}", timeout=5
              ) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path}: HTTP {response.status}")
                  payload = json.load(response)
              expected = {"service": service, "status": status}
              if payload != expected:
                  raise RuntimeError(f"{path}: expected {expected}, got {payload}")
              print(f"{service} {path}: OK")
          PY

      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200 "${SERVICE}-service"

      - name: Clean up
        if: always()
        run: docker compose down --volumes --remove-orphans

services:
  app:
    build: .
    container_name: fluently-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=fluently
      - DB_PASSWORD=fluently123
      - DB_NAME=fluently
    volumes:
      - .:/usr/src/app
      - node_modules:/usr/src/app/node_modules  # nommé ici
    depends_on:
      - postgres
    command: npm run start:dev

  postgres:
    image: postgres:16-alpine
    container_name: fluently-postgres
    restart: always
    environment:
      POSTGRES_DB: fluently
      POSTGRES_USER: fluently
      POSTGRES_PASSWORD: fluently123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: fluently-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fluently.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

  conversation-service:
    build:
      context: ./ai-services/conversation-service
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  recommendation-service:
    build:
      context: ./ai-services/recommendation-service
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  matchmaking-service:
    build:
      context: ./ai-services/matchmaking-service
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  event-generator-service:
    build:
      context: ./ai-services/event-generator-service
    ports:
      - "127.0.0.1:8004:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  feedback-analysis-service:
    build:
      context: ./ai-services/feedback-analysis-service
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  node_modules:   # déclare le volume nommé
